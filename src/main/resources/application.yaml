spring:
  application:
    name: healtheat-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healtheat}
    username: ${DB_USERNAME:healtheat}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
