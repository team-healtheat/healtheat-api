name: Backend test and deployment

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healtheat_test
          POSTGRES_USER: healtheat
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healtheat -d healtheat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/healtheat_test
      DB_USERNAME: healtheat
      DB_PASSWORD: test-only-password
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes-long
      AI_CHAT_MODEL: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build
        run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: healtheat-application
          path: build/libs/healtheat-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, healtheat-deploy]
    concurrency:
      group: healtheat-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: healtheat-application
          path: build/libs
      - name: Deploy and verify HTTPS
        run: bash deploy/deploy.sh
