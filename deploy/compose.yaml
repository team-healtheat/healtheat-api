services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healtheat
      POSTGRES_USER: healtheat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healtheat -d healtheat"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  app:
    image: healtheat-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/healtheat
      DB_USERNAME: healtheat
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=160m
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 96m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
